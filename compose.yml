name: daconnas-media

x-linuxserver: &linuxserver
  restart: unless-stopped
  environment:
    PUID: ${PUID}
    PGID: ${PGID}
    TZ: ${TZ}
  networks:
    - media

services:
  jellyfin:
    image: jellyfin/jellyfin:10
    container_name: daconnas-jellyfin
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
    ports:
      - "${JELLYFIN_BIND_ADDRESS}:${JELLYFIN_PORT}:8096"
    volumes:
      - "${APPDATA_DIR}/jellyfin:/config"
      - "${CACHE_DIR}/jellyfin:/cache"
      - "${MEDIA_DIR}:/data/media:ro"
    networks:
      - media

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: daconnas-seerr
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ}
    ports:
      - "${ADMIN_BIND_ADDRESS}:${SEERR_PORT}:5055"
    volumes:
      - "${APPDATA_DIR}/seerr:/app/config"
    networks:
      - media

  sonarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/sonarr:latest
    container_name: daconnas-sonarr
    ports:
      - "${ADMIN_BIND_ADDRESS}:${SONARR_PORT}:8989"
    volumes:
      - "${APPDATA_DIR}/sonarr:/config"
      - "${MEDIA_DIR}:/data/media"
      - "${DOWNLOADS_DIR}:/data/downloads"

  radarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/radarr:latest
    container_name: daconnas-radarr
    ports:
      - "${ADMIN_BIND_ADDRESS}:${RADARR_PORT}:7878"
    volumes:
      - "${APPDATA_DIR}/radarr:/config"
      - "${MEDIA_DIR}:/data/media"
      - "${DOWNLOADS_DIR}:/data/downloads"

  prowlarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: daconnas-prowlarr
    ports:
      - "${ADMIN_BIND_ADDRESS}:${PROWLARR_PORT}:9696"
    volumes:
      - "${APPDATA_DIR}/prowlarr:/config"

  bazarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/bazarr:latest
    container_name: daconnas-bazarr
    ports:
      - "${ADMIN_BIND_ADDRESS}:${BAZARR_PORT}:6767"
    volumes:
      - "${APPDATA_DIR}/bazarr:/config"
      - "${MEDIA_DIR}:/data/media"

  qbittorrent:
    <<: *linuxserver
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: daconnas-qbittorrent
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: 8080
    ports:
      - "${ADMIN_BIND_ADDRESS}:${QBITTORRENT_PORT}:8080"
    volumes:
      - "${APPDATA_DIR}/qbittorrent:/config"
      - "${DOWNLOADS_DIR}:/data/downloads"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: daconnas-cloudflared
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - media

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: daconnas-homepage
    restart: unless-stopped
    profiles:
      - dashboard
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "*"
      TZ: ${TZ}
    ports:
      - "${ADMIN_BIND_ADDRESS}:${HOMEPAGE_PORT}:3000"
    volumes:
      - "${APPDATA_DIR}/homepage:/app/config"
    networks:
      - media

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: daconnas-flaresolverr
    restart: unless-stopped
    profiles:
      - compat
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    ports:
      - "${ADMIN_BIND_ADDRESS}:${FLARESOLVERR_PORT}:8191"
    networks:
      - media

networks:
  media:
    name: daconnas-media
